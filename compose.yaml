services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olimora-api
    environment:
      DATABASE_URL: postgresql+asyncpg://olimora:olimora-local-dev@postgres:5432/olimora
      APP_ENV: development
      LOG_LEVEL: INFO
      EPHEMERIS_PATH: /app/ephe
      APP_VERSION: 0.1.0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: olimora-postgres
    environment:
      POSTGRES_DB: olimora
      POSTGRES_USER: olimora
      POSTGRES_PASSWORD: olimora-local-dev
    ports:
      - "5432:5432"
    volumes:
      - olimora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olimora -d olimora"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  olimora_postgres_data:
